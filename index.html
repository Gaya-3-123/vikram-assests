<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vikram.M | Professional Portfolio</title>
    <style>
        /* Matrix Dark Theme */
        body { background-color: #010a01; color: #00ff41; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .portfolio-card { border: 2px solid #00ff41; border-radius: 15px; padding: 30px; background: rgba(0, 20, 0, 0.9); box-shadow: 0 0 25px #00ff41; max-width: 500px; width: 100%; text-align: center; }
        
        /* Profile Image with Matrix Effect */
        .profile-container { position: relative; width: 180px; height: 180px; margin: 0 auto 20px; border: 3px solid #00ff41; border-radius: 50%; overflow: hidden; box-shadow: 0 0 15px #00ff41; }
        .profile-container img { width: 100%; height: 100%; object-fit: cover; filter: sepia(100%) hue-rotate(80deg) brightness(1.2) contrast(1.2); }
        
        h1 { font-size: 28px; margin: 10px 0; letter-spacing: 2px; text-shadow: 0 0 10px #00ff41; }
        .role { color: #fff; font-size: 16px; letter-spacing: 1px; margin-bottom: 20px; display: block; border-bottom: 1px solid #00ff41; padding-bottom: 10px; }

        /* Skill Level Bars - Like your screenshot */
        .skills-grid { display: flex; justify-content: space-around; margin: 30px 0; padding: 15px; border: 1px solid rgba(0, 255, 65, 0.3); border-radius: 10px; }
        .skill-column { display: flex; flex-direction: column; align-items: center; width: 20%; }
        .bar-container { width: 12px; height: 80px; background: #002200; border: 1px solid #00ff41; position: relative; margin-bottom: 10px; border-radius: 2px; }
        .bar-fill { position: absolute; bottom: 0; width: 100%; background: linear-gradient(to top, #004400, #00ff41); box-shadow: 0 0 8px #00ff41; }
        .skill-label { font-size: 9px; color: #fff; text-transform: uppercase; line-height: 1.2; height: 30px; }

        /* Project Boxes */
        .section-header { font-size: 14px; text-transform: uppercase; margin-bottom: 15px; color: #00ff41; text-align: left; border-left: 4px solid #00ff41; padding-left: 10px; }
        .project-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .project-box { border: 1px solid #00ff41; padding: 10px; border-radius: 8px; font-size: 11px; background: rgba(0, 40, 0, 0.5); text-align: left; }
        .project-num { color: #00ff41; font-weight: bold; margin-bottom: 5px; display: block; }
        
        footer { margin-top: 30px; font-size: 10px; opacity: 0.6; }
    </style>
</head>
<body>

    <div class="portfolio-card">
        <div class="profile-container">
            <!-- Using the WhatsApp image link we fixed earlier -->
            <img src="https://raw.githubusercontent.com/Gaya-3-123/vikram-assests/main/WhatsApp%20Image%202026-05-13%20at%203.01.32%20PM.jpeg" alt="Vikram.M">
        </div>

        <h1>VIKRAM.M</h1>
        <span class="role">JAVA FULL STACK DEVELOPER</span>

        <div class="section-header">Technical Skills</div>
        <div class="skills-grid">
            <div class="skill-column">
                <div class="bar-container"><div class="bar-fill" style="height: 85%;"></div></div>
                <span class="skill-label">Java<br>Core</span>
            </div>
            <div class="skill-column">
                <div class="bar-container"><div class="bar-fill" style="height: 75%;"></div></div>
                <span class="skill-label">Spring<br>Boot</span>
            </div>
            <div class="skill-column">
                <div class="bar-container"><div class="bar-fill" style="height: 70%;"></div></div>
                <span class="skill-label">SQL<br>DB</span>
            </div>
            <div class="skill-column">
                <div class="bar-container"><div class="bar-fill" style="height: 65%;"></div></div>
                <span class="skill-label">React<br>JS</span>
            </div>
            <div class="skill-column">
                <div class="bar-container"><div class="bar-fill" style="height: 60%;"></div></div>
                <span class="skill-label">API<br>Dev</span>
            </div>
        </div>

        <div class="section-header">Project Highlights</div>
        <div class="project-container">
            <div class="project-box">
                <span class="project-num">01</span>
                <strong>Smart Banking</strong><br>Secure J2EE based banking system.
            </div>
            <div class="project-box">
                <span class="project-num">02</span>
                <strong>E-Store App</strong><br>Full Stack Spring Boot E-commerce.
            </div>
        </div>

        <footer>SYSTEM.READY // ACCESS GRANTED • 2026</footer>
    </div>

</body>
</html>
